name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    # composer.json resolves migears/pages and migears/template through path
    # repositories ("../migears-pages", "../migears-template") and neither is on
    # Packagist, so both have to sit beside this package rather than under
    # vendor/. That is also why every command runs from a subdirectory: those
    # paths are relative to this package's own directory, so this package cannot
    # be checked out at the workspace root.
    defaults:
      run:
        working-directory: migears-xml-pages

    steps:
      - name: Check out this package
        uses: actions/checkout@v7
        with:
          path: migears-xml-pages

      # Their default branches, so the trio moves together.
      - name: Check out migears-pages
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-pages
          path: migears-pages

      - name: Check out migears-template
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-template
          path: migears-template

      # BundledComponentsTest compares this package's components with the other
      # front end's and skips when it is absent — so it is checked out here too,
      # and the skip is turned into a failure below: those four components are
      # meant to be byte-for-byte identical, and a silent skip would report that
      # check as passing while running none of it.
      - name: Check out migears-yaml-pages
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-yaml-pages
          path: migears-yaml-pages

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit --fail-on-skipped
